name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore GSB_project.slnx
      - name: Audit direct and transitive packages
        shell: pwsh
        run: |
          $raw = dotnet list GSB_project.slnx package --include-transitive --vulnerable --format json --no-restore | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed.' }
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $raw | Set-Content TestResults/package-audit.json
          $report = $raw | ConvertFrom-Json
          $vulnerable = @(foreach ($project in $report.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { $package.id }
              }
            }
          })
          if ($vulnerable.Count -gt 0) { throw "Vulnerable packages: $($vulnerable -join ', ')" }
      - run: dotnet build GSB_project.slnx --no-restore --configuration Release
      - run: dotnet test GSB_project.slnx --no-build --no-restore --configuration Release --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

